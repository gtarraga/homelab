name: Build patched vendor Node runtimes

on:
  push:
    branches: [main]
    paths:
      - tools/node-runtime/**
      - .github/workflows/vendor-node-runtime-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: litellm
            app-image: ghcr.io/berriai/litellm@sha256:b3db76b5251485ab332bb91b30984991c6f53144b5c1c4371b4bd9766749e45f
            node-image: node:26.12.1-bookworm-slim@sha256:b3dbaf0531ffedead011f14afc779688202fc975f89d2cebf2a63e8beed89e8a
            node-path: /usr/bin/node
            dockerfile: Dockerfile.node26
          - app: ghostfolio
            app-image: docker.io/ghostfolio/ghostfolio@sha256:5e4e8b538534dd7c219f9c03f16cba56a88f9225a3408dab7931895eba3061b0
            node-image: node:22.23.4-bookworm-slim@sha256:5991875dfb80938dd8a6ba3fe3e96fd04929e70792762b3319d8caadbbe229bc
            node-path: /usr/local/bin/node
            dockerfile: Dockerfile
          - app: hermes
            app-image: docker.io/nousresearch/hermes-agent@sha256:9ad3b04ec916ea2c2da22358fd43b024c788d74073210695af88bfc2e63869b4
            node-image: node:22.23.4-bookworm-slim@sha256:5991875dfb80938dd8a6ba3fe3e96fd04929e70792762b3319d8caadbbe229bc
            node-path: /usr/local/bin/node
            dockerfile: Dockerfile
          - app: homepage
            app-image: ghcr.io/gethomepage/homepage@sha256:63434aafeb3d49be1f21ebd3c5d777fe5b7794c31342daad4e96f09b72a57188
            node-image: node:22.23.4-alpine@sha256:ce8d97f7cfc7c5386421eb932df20a29df99b1a7f469f6157d5c9956702ffadc
            node-path: /usr/local/bin/node
            dockerfile: Dockerfile
          - app: zigbee2mqtt
            app-image: ghcr.io/koenkk/zigbee2mqtt@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
            node-image: node:24.22.1-alpine@sha256:6a1c190e17215d844926b0677f4bf87273ff7d5e54db06d3b5b5863ab0b09a3d
            node-path: /usr/bin/node
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/node-runtime
          file: tools/node-runtime/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_IMAGE=${{ matrix.app-image }}
            NODE_IMAGE=${{ matrix.node-image }}
            NODE_PATH=${{ matrix.node-path }}
          tags: ghcr.io/gtarraga/vendor-node-${{ matrix.app }}:${{ github.sha }}
