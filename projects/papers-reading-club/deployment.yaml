apiVersion: apps/v1
kind: Deployment
metadata:
  name: papers-reading-club
  namespace: projects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: papers-reading-club
  template:
    metadata:
      labels:
        app: papers-reading-club
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: papers-reading-club
        image: ghcr.io/gtarraga/papers-reading-club:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: CLUB_STOPPED
          value: 'true'
        - name: NODE_OPTIONS
          value: --use-openssl-ca
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: SSL_CERT_DIR
          value: /etc/ssl/certs
        envFrom:
        - secretRef:
            name: papers-reading-club-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: data
        - name: data
          mountPath: /app/logs
          subPath: logs
        - name: node-patched-trust
          mountPath: /etc/ssl/certs
          subPath: system
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: papers-reading-club-data
      - name: node-trust-script
        configMap:
          name: node-emudhra-trust
      - name: node-patched-trust
        emptyDir: {}
      initContainers:
      - name: prepare-node-trust
        image: ghcr.io/gtarraga/papers-reading-club@sha256:56d5ce5dddcb02e3419e0e927ec77afb13f807c45e67b17cd4e888e83e82d820
        imagePullPolicy: Always
        command:
        - node
        - /trust-script/filter.cjs
        volumeMounts:
        - name: node-trust-script
          mountPath: /trust-script
          readOnly: true
        - name: node-patched-trust
          mountPath: /patched-trust
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
