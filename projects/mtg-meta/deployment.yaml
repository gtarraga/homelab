apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtg-meta
  namespace: projects
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mtg-meta
  template:
    metadata:
      labels:
        app: mtg-meta
    spec:
      nodeSelector:
        kubernetes.io/hostname: jitte
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mtg-meta
          image: docker.io/library/mtg-meta:homelab-2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_ORIGIN
              value: https://mtgmeta.stoneforge.dev
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mtg-meta-data
