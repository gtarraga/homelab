apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtg-meta
  namespace: projects
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: projects-mtg-meta-tailnet@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mtgmeta.stoneforge.dev
  rules:
    - host: mtgmeta.stoneforge.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtg-meta
                port:
                  name: http
