apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtarraga-com
  namespace: projects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gtarraga-com
  template:
    metadata:
      labels:
        app: gtarraga-com
    spec:
      nodeSelector:
        location: edge
      tolerations:
      - key: location
        operator: Equal
        value: edge
        effect: NoSchedule
      containers:
      - name: gtarraga-com
        image: ghcr.io/gtarraga/personal-site@sha256:7d879be8c8018785525a55a13b63e78394bf0f0bfa77e5f38d8b79a640082a45
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 2
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        env:
        - name: NODE_OPTIONS
          value: --use-openssl-ca
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: SSL_CERT_DIR
          value: /etc/ssl/certs
        volumeMounts:
        - name: node-patched-trust
          mountPath: /etc/ssl/certs
          subPath: system
          readOnly: true
      initContainers:
      - name: prepare-node-trust
        image: ghcr.io/gtarraga/personal-site@sha256:7d879be8c8018785525a55a13b63e78394bf0f0bfa77e5f38d8b79a640082a45
        imagePullPolicy: Always
        command:
        - node
        - /trust-script/filter.cjs
        volumeMounts:
        - name: node-trust-script
          mountPath: /trust-script
          readOnly: true
        - name: node-patched-trust
          mountPath: /patched-trust
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: node-trust-script
        configMap:
          name: node-emudhra-trust
      - name: node-patched-trust
        emptyDir: {}
