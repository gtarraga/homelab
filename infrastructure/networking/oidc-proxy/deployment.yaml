apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-proxy
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-proxy
  template:
    metadata:
      labels:
        app: oidc-proxy
    spec:
      serviceAccountName: oidc-proxy
      containers:
        - name: oidc-proxy
          image: ghcr.io/gtarraga/oidc-proxy@sha256:f0d7f09de11e01c05e3bae6fdb9acdd2a9165a3e39f5d52a7bc1dcbb9a4f67d8
          imagePullPolicy: Always
          env:
            - name: PUBLIC_ISSUER_URL
              value: https://oidc.stoneforge.dev
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
