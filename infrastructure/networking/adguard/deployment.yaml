apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      # DNS must also be reachable on jitte's Tailscale IP for tailnet split DNS.
      # Keep pinned while local-path PVCs are on jitte.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: jitte
      initContainers:
        - name: prepare-ca-trust
          image: docker.io/adguard/adguardhome@sha256:f29c58a91f79387cbbbb042e140814f58e830d457d44af03d662c8df43db9dea
          command:
          - sh
          - /trust-policy/filter-emudhra.sh
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
          - name: emudhra-trust-policy
            mountPath: /trust-policy
            readOnly: true
          - name: emudhra-trust
            mountPath: /patched-trust
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /config/AdGuardHome.yaml /conf/AdGuardHome.yaml
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: adguard
          image: docker.io/adguard/adguardhome@sha256:f29c58a91f79387cbbbb042e140814f58e830d457d44af03d662c8df43db9dea
          imagePullPolicy: IfNotPresent
          env:
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/ca-certificates.crt
          - name: SSL_CERT_DIR
            value: /etc/ssl/certs
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 3001
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: emudhra-trust
              mountPath: /etc/ssl/certs
              subPath: system
              readOnly: true
            - name: conf
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
      volumes:
        - name: conf
          persistentVolumeClaim:
            claimName: adguard-conf
        - name: work
          persistentVolumeClaim:
            claimName: adguard-work
        - name: config
          secret:
            secretName: adguard-config
            items:
              - key: AdGuardHome.yaml
                path: AdGuardHome.yaml
        - name: emudhra-trust
          emptyDir: {}
        - name: emudhra-trust-policy
          configMap:
            name: emudhra-system-trust
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emudhra-system-trust
  namespace: infra
data:
  filter-emudhra.sh: |
    #!/bin/sh
    # Interim root distrust until vendor images ship the October 2026 CA updates.
    # Exact DER certs from https://emudhra.we-have-a-problem.com/roots.json,
    # SHA256 checked at policy generation. Preserve every other certificate.
    # Uses only POSIX sh, mkdir, chmod; no downloads or package installation.
    # Init and application must use the SAME immutable vendor image digest.
    set -eu
    umask 022
    mkdir -p /patched-trust/system
    newline='
    '
    carriage=$(printf '\r')
    for source in /etc/ssl/certs/*; do
      test -f "$source" || { echo "Unexpected CA directory or broken link: $source" >&2; exit 1; }
      destination="/patched-trust/system/${source##*/}"
      collecting=0
      : > "$destination"
      while IFS= read -r line || test -n "$line"; do
        line=${line%"$carriage"}
        case "$line" in
          '-----BEGIN CERTIFICATE-----')
            test "$collecting" = 0 || exit 1
            collecting=1; buffer="$line$newline"; der=''
            ;;
          '-----END CERTIFICATE-----')
            test "$collecting" = 1 || exit 1
            buffer="$buffer$line$newline"
            case "$der" in
              # emSign Root TLS CA - G3 SHA256 7DD78D5F4F13459A83DFF9ABBBA62EDBAF6F2D102BF257FD712F4D9F2746ED8D
              ) : ;;
              # emSign Root CS CA - G3 SHA256 F2EDAAFF3D9B701FB4D14C9F285F8C0BAD90FC3BCC1FA07D47F4718EDABA34A5
              ) : ;;
              # AAA Certificate Services SHA256 D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4
              ) : ;;
              # emSign ECC Root CA - G3 SHA256 86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B
              ) : ;;
              *) printf '%s' "$buffer" >> "$destination" ;;
            esac
            collecting=0
            ;;
          *)
            if test "$collecting" = 1; then
              case "$line" in *[!A-Za-z0-9+/=]*) echo "Malformed PEM base64" >&2; exit 1 ;; esac
              buffer="$buffer$line$newline"; der="$der$line"
            else
              printf '%s\n' "$line" >> "$destination"
            fi
            ;;
        esac
      done < "$source"
      test "$collecting" = 0 || { echo "Unclosed certificate: $source" >&2; exit 1; }
      chmod 0644 "$destination"
    done
    test -s /patched-trust/system/ca-certificates.crt
    chmod 0755 /patched-trust/system
    echo "Prepared filtered system CA store"
