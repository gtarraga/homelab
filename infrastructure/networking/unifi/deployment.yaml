apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      nodeSelector:
        kubernetes.io/hostname: jitte
      initContainers:
        - name: prepare-certificate-trust
          image: lscr.io/linuxserver/unifi-network-application:10.3.58@sha256:b01b8b127fd0dea381199958539eaae82dce10f9a23dab0c5cbfc836001cc7e0
          command: ["/bin/sh", "/trust-policy/filter-trust.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: certificate-trust
              mountPath: /patched-trust
            - name: certificate-policy
              mountPath: /trust-policy
              readOnly: true
      containers:
        - name: unifi
          image: lscr.io/linuxserver/unifi-network-application:10.3.58@sha256:b01b8b127fd0dea381199958539eaae82dce10f9a23dab0c5cbfc836001cc7e0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https-admin
              containerPort: 8443
              protocol: TCP
            - name: inform
              containerPort: 8080
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: discovery
              containerPort: 10001
              protocol: UDP
            - name: speedtest
              containerPort: 6789
              protocol: TCP
            - name: guest-http
              containerPort: 8880
              protocol: TCP
            - name: guest-https
              containerPort: 8843
              protocol: TCP
            - name: ssdp
              containerPort: 1900
              protocol: UDP
            - name: syslog
              containerPort: 5514
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Madrid
            - name: MONGO_USER
              value: unifi
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-env
                  key: MONGO_PASS
            - name: MONGO_HOST
              value: unifi-mongo
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: unifi
            - name: MONGO_AUTHSOURCE
              value: admin
            - name: MEM_STARTUP
              value: "512"
            - name: MEM_LIMIT
              value: "1024"
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          volumeMounts:
            - name: config
              mountPath: /config
            - name: certificate-trust
              mountPath: /etc/ssl/certs
              subPath: system
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: unifi-config
        - name: certificate-trust
          emptyDir: {}
        - name: certificate-policy
          configMap:
            name: unifi-certificate-trust
