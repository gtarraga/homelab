apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: longhorn
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    global:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
    persistence:
      createStorageClass: false
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: '{"v1":"2","v2":"2"}'
      replicaSoftAntiAffinity: false
      storageOverProvisioningPercentage: 100
      storageMinimalAvailablePercentage: 25
      storageReservedPercentageForDefaultDisk: 30
      systemManagedComponentsNodeSelector: node.longhorn.io/create-default-disk:true
      csiAllowedTopologyKeys: node.longhorn.io/create-default-disk
      v1DataEngine: true
      v2DataEngine: false
      upgradeChecker: false
    longhornGlobalManager:
      replicas: 2
    longhornUI:
      replicas: 1
    csi:
      kubeletRootDir: /var/lib/kubelet
      attacherReplicaCount: 2
      provisionerReplicaCount: 2
      resizerReplicaCount: 2
      snapshotterReplicaCount: 2
