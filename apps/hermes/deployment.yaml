apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: hermes
          image: nousresearch/hermes-agent@sha256:9ad3b04ec916ea2c2da22358fd43b024c788d74073210695af88bfc2e63869b4
          imagePullPolicy: IfNotPresent
          command:
            - /init
          args:
            - /opt/hermes/docker/main-wrapper.sh
            - gateway
            - run
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          env:
            - name: API_SERVER_ENABLED
              value: 'true'
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: '8642'
            - name: API_SERVER_KEY
              value: sk-hermes-local-change-me
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_DASHBOARD
              value: '1'
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: '9119'
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: admin
            - name: HERMES_UID
              value: '10000'
            - name: HERMES_GID
              value: '10000'
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            - name: NODE_OPTIONS
              value: --use-openssl-ca
          envFrom:
            - secretRef:
                name: hermes-dashboard-auth
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SETUID
                - SETGID
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config-hooks
              mountPath: /etc/cont-init.d/03-custom-providers
              subPath: 03-custom-providers
              readOnly: true
            - name: config-hooks
              mountPath: /etc/hermes-config-hooks
              readOnly: true
            - name: emudhra-trust
              mountPath: /etc/ssl/certs
              subPath: system
              readOnly: true
            - name: emudhra-trust
              mountPath: /opt/hermes/.venv/lib/python3.13/site-packages/certifi/cacert.pem
              subPath: certifi.pem
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config-hooks
          configMap:
            name: hermes-config-hooks
            defaultMode: 365
        - name: emudhra-trust
          emptyDir:
            sizeLimit: 8Mi
        - name: emudhra-trust-policy
          configMap:
            name: hermes-emudhra-trust
      initContainers:
        - name: prepare-certificate-trust
          image: nousresearch/hermes-agent@sha256:9ad3b04ec916ea2c2da22358fd43b024c788d74073210695af88bfc2e63869b4
          imagePullPolicy: IfNotPresent
          command:
            - /opt/hermes/.venv/bin/python3
            - /trust-policy/filter-emudhra.py
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: emudhra-trust
              mountPath: /patched-trust
            - name: emudhra-trust-policy
              mountPath: /trust-policy
              readOnly: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-emudhra-trust
  namespace: apps
data:
  filter-emudhra.py: |
    """Prepare per-image CA stores for an initContainer; no network or dependencies.

    Interim root distrust, pending vendor images with the October 2026 CA updates.
    Fingerprints: https://emudhra.we-have-a-problem.com/roots.json
    Mount the output system directory and certifi.pem read-only into the application.
    The input stores are copied from the SAME image digest as the application.
    """

    import hashlib
    import os
    from pathlib import Path
    import re
    import ssl

    import certifi


    BLOCKED = {
        # emSign Root TLS CA - G3
        "7DD78D5F4F13459A83DFF9ABBBA62EDBAF6F2D102BF257FD712F4D9F2746ED8D",
        # emSign Root CS CA - G3
        "F2EDAAFF3D9B701FB4D14C9F285F8C0BAD90FC3BCC1FA07D47F4718EDABA34A5",
        # AAA Certificate Services
        "D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4",
        # emSign ECC Root CA - G3
        "86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B",
    }
    CERTIFICATE = re.compile(
        rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", re.DOTALL
    )


    def filter_pem(data):
        certificates = CERTIFICATE.findall(data)
        if len(certificates) != data.count(b"-----BEGIN CERTIFICATE-----"):
            raise ValueError("Malformed certificate boundary")
        # Validate every certificate, including retained custom roots.
        def replace(match):
            pem = match.group().decode("ascii")
            der = ssl.PEM_cert_to_DER_cert(pem)
            context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
            context.load_verify_locations(cadata=pem)
            return b"" if hashlib.sha256(der).hexdigest().upper() in BLOCKED else match.group()

        return CERTIFICATE.sub(replace, data), len(certificates)


    def prepare(output=Path("/patched-trust")):
        system = output / "system"
        system.mkdir(parents=True, exist_ok=True)
        # Dereference hash symlinks, so no link can lead back to an unfiltered root.
        for source in Path("/etc/ssl/certs").iterdir():
            if source.is_dir():
                raise ValueError("Unexpected nested CA directory: " + str(source))
            if not source.exists():
                raise ValueError("Broken CA symlink: " + str(source))
            original = source.read_bytes()
            filtered, count = filter_pem(original)
            if count and not CERTIFICATE.search(filtered):
                continue
            destination = system / source.name
            destination.write_bytes(filtered)
            destination.chmod(source.stat().st_mode & 0o777)

        for source, destination in [
            (Path("/etc/ssl/certs/ca-certificates.crt"), system / "ca-certificates.crt"),
            (Path(certifi.where()), output / "certifi.pem"),
        ]:
            filtered, count = filter_pem(source.read_bytes())
            if not count:
                raise ValueError("Empty input CA bundle: " + str(source))
            destination.write_bytes(filtered)
            destination.chmod(0o644)
            context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
            context.load_verify_locations(cafile=str(destination))
            roots = context.get_ca_certs(binary_form=True)
            if not roots or any(hashlib.sha256(root).hexdigest().upper() in BLOCKED for root in roots):
                raise ValueError("Filtered CA store validation failed")
            print(str(source) + ": retained " + str(len(roots)) + " trusted CA certificates")
        system.chmod(0o755)


    if __name__ == "__main__":
        prepare()
