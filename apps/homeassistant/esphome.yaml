apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-config
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      labels:
        app: esphome
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: cradle
      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome:2026.7.3
          args:
            - dashboard
            - /config
          ports:
            - name: http
              containerPort: 6052
              protocol: TCP
          env:
            - name: ESPHOME_TRUSTED_DOMAINS
              value: esphome.stoneforge.dev
          readinessProbe:
            httpGet:
              path: /version
              port: 6052
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /version
              port: 6052
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: esphome-config
---
apiVersion: v1
kind: Service
metadata:
  name: esphome
  namespace: homeassistant
spec:
  selector:
    app: esphome
  ports:
    - name: http
      port: 6052
      targetPort: 6052
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: esphome
  namespace: homeassistant
spec:
  ingressClassName: traefik
  rules:
    - host: esphome.stoneforge.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: esphome
                port:
                  number: 6052
