apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: homepage
        image: ghcr.io/gtarraga/vendor-node-homepage@sha256:ffd8923373037d325595cc10792403eca9fd7d26ae5f6c612c3f40dcc5acb8f4
        ports:
        - containerPort: 3000
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: '*'
        - name: NODE_OPTIONS
          value: --use-openssl-ca
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: SSL_CERT_DIR
          value: /etc/ssl/certs
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: node-patched-trust
          mountPath: /etc/ssl/certs
          subPath: system
          readOnly: true
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: homepage-config
      - name: node-trust-script
        configMap:
          name: node-emudhra-trust
      - name: node-patched-trust
        emptyDir: {}
      initContainers:
      - name: prepare-node-trust
        image: ghcr.io/gtarraga/vendor-node-homepage@sha256:ffd8923373037d325595cc10792403eca9fd7d26ae5f6c612c3f40dcc5acb8f4
        imagePullPolicy: IfNotPresent
        command:
        - node
        - /trust-script/filter.cjs
        volumeMounts:
        - name: node-trust-script
          mountPath: /trust-script
          readOnly: true
        - name: node-patched-trust
          mountPath: /patched-trust
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
