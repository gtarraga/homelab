apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: calibre.stoneforge.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calibre
                port:
                  number: 8083
