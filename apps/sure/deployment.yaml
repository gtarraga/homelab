apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sure-app-storage
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-web
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sure-web
  template:
    metadata:
      labels:
        app: sure-web
      annotations:
        emudhra-trust-policy-sha256: dc5e263f54663591c103d37685127016e9eb60372187bf76e3d3901c101f8aef
    spec:
      containers:
        - name: sure
          image: ghcr.io/we-promise/sure@sha256:55c4da94f60a6a0e1da107dd6d61bdef06661bebaed26c1cd2a5c4d3d10af4ef
          ports:
            - containerPort: 3000
          env:
            - name: SELF_HOSTED
              value: 'true'
            - name: RAILS_FORCE_SSL
              value: 'false'
            - name: RAILS_ASSUME_SSL
              value: 'true'
            - name: DB_HOST
              value: sure-postgres
            - name: DB_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: sure_production
            - name: POSTGRES_USER
              value: sure_user
            - name: REDIS_URL
              value: redis://sure-redis:6379/1
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sure-env
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: sure-env
                  key: SECRET_KEY_BASE
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: app-storage
              mountPath: /rails/storage
            - name: emudhra-trust
              mountPath: /etc/ssl/certs
              subPath: system
              readOnly: true
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: sure-app-storage
        - name: emudhra-trust
          emptyDir:
            sizeLimit: 8Mi
        - name: emudhra-trust-policy
          configMap:
            name: sure-web-emudhra-trust
      initContainers:
        - name: prepare-certificate-trust
          image: ghcr.io/we-promise/sure@sha256:55c4da94f60a6a0e1da107dd6d61bdef06661bebaed26c1cd2a5c4d3d10af4ef
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /trust-policy/filter-emudhra.sh
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: emudhra-trust
              mountPath: /patched-trust
            - name: emudhra-trust-policy
              mountPath: /trust-policy
              readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-worker
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sure-worker
  template:
    metadata:
      labels:
        app: sure-worker
      annotations:
        emudhra-trust-policy-sha256: dc5e263f54663591c103d37685127016e9eb60372187bf76e3d3901c101f8aef
    spec:
      containers:
        - name: sure-worker
          image: ghcr.io/we-promise/sure@sha256:55c4da94f60a6a0e1da107dd6d61bdef06661bebaed26c1cd2a5c4d3d10af4ef
          command:
            - bundle
            - exec
            - sidekiq
          env:
            - name: SELF_HOSTED
              value: 'true'
            - name: RAILS_FORCE_SSL
              value: 'false'
            - name: RAILS_ASSUME_SSL
              value: 'true'
            - name: DB_HOST
              value: sure-postgres
            - name: DB_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: sure_production
            - name: POSTGRES_USER
              value: sure_user
            - name: REDIS_URL
              value: redis://sure-redis:6379/1
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sure-env
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: sure-env
                  key: SECRET_KEY_BASE
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: app-storage
              mountPath: /rails/storage
            - name: emudhra-trust
              mountPath: /etc/ssl/certs
              subPath: system
              readOnly: true
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: sure-app-storage
        - name: emudhra-trust
          emptyDir:
            sizeLimit: 8Mi
        - name: emudhra-trust-policy
          configMap:
            name: sure-worker-emudhra-trust
      initContainers:
        - name: prepare-certificate-trust
          image: ghcr.io/we-promise/sure@sha256:55c4da94f60a6a0e1da107dd6d61bdef06661bebaed26c1cd2a5c4d3d10af4ef
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /trust-policy/filter-emudhra.sh
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: emudhra-trust
              mountPath: /patched-trust
            - name: emudhra-trust-policy
              mountPath: /trust-policy
              readOnly: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sure-web-emudhra-trust
  namespace: apps
data:
  filter-emudhra.sh: |
    #!/bin/sh
    # Interim root distrust until vendor images ship the October 2026 CA updates.
    # Exact DER certs from https://emudhra.we-have-a-problem.com/roots.json,
    # SHA256 checked at policy generation. Preserve every other certificate.
    # Uses only POSIX sh, mkdir, chmod, rm; no downloads or package installation.
    # Init and application must use the SAME immutable vendor image digest.
    set -eu
    umask 022
    mkdir -p /patched-trust/system
    newline='
    '
    carriage=$(printf '\r')
    for source in /etc/ssl/certs/*; do
      test -f "$source" || { echo "Unexpected CA directory or broken link: $source" >&2; exit 1; }
      destination="/patched-trust/system/${source##*/}"
      collecting=0
      input_certificates=0; retained_certificates=0
      : > "$destination"
      while IFS= read -r line || test -n "$line"; do
        line=${line%"$carriage"}
        case "$line" in
          '-----BEGIN CERTIFICATE-----')
            test "$collecting" = 0 || exit 1
            input_certificates=$((input_certificates + 1))
            collecting=1; buffer="$line$newline"; der=''
            ;;
          '-----END CERTIFICATE-----')
            test "$collecting" = 1 || exit 1
            buffer="$buffer$line$newline"
            case "$der" in
              # emSign Root TLS CA - G3 SHA256 7DD78D5F4F13459A83DFF9ABBBA62EDBAF6F2D102BF257FD712F4D9F2746ED8D
              ) : ;;
              # emSign Root CS CA - G3 SHA256 F2EDAAFF3D9B701FB4D14C9F285F8C0BAD90FC3BCC1FA07D47F4718EDABA34A5
              ) : ;;
              # AAA Certificate Services SHA256 D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4
              ) : ;;
              # emSign ECC Root CA - G3 SHA256 86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B
              ) : ;;
              *) retained_certificates=$((retained_certificates + 1)); printf '%s' "$buffer" >> "$destination" ;;
            esac
            collecting=0
            ;;
          *)
            if test "$collecting" = 1; then
              case "$line" in *[!A-Za-z0-9+/=]*) echo "Malformed PEM base64" >&2; exit 1 ;; esac
              buffer="$buffer$line$newline"; der="$der$line"
            else
              printf '%s\n' "$line" >> "$destination"
            fi
            ;;
        esac
      done < "$source"
      test "$collecting" = 0 || { echo "Unclosed certificate: $source" >&2; exit 1; }
      if test "$input_certificates" -gt 0 && test "$retained_certificates" = 0; then
        rm "$destination"
      else
        chmod 0644 "$destination"
      fi
    done
    test -s /patched-trust/system/ca-certificates.crt
    chmod 0755 /patched-trust/system
    echo "Prepared filtered system CA store"
---
